# fly launch --copy-config --no-deploy  →  fly volumes create workpaper_data --size 1  →  fly deploy
app = "miraflores-workpaper"
primary_region = "dfw"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "workpaper_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
